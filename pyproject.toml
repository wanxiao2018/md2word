[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2word"
version = "1.2.0"
description = "Convert AI-generated Markdown into Word-ready rich text, .docx, and PDF with editable equations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "wanxiao2018" }]
keywords = ["markdown", "word", "docx", "pandoc", "omml", "clipboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
]
dependencies = [
    "python-docx>=1.1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/wanxiao2018/md2word"
Issues = "https://github.com/wanxiao2018/md2word/issues"

[project.gui-scripts]
md2word = "md2word.gui:run"

[tool.setuptools.packages.find]
include = ["md2word*"]
exclude = ["tests*", "examples*"]
